<script>

id": "E:finding:N:finding:R1-cleared:1->conclusion", "source": "N:finding:R1-cleared:1", "target": "N:conclusion", "label": "满足", "prop": "satisfies", "conform": true}}, {"data": {"id": "E:rule:R4-cleared->N:finding:R4-cleared:1", "source": "N:rule:R4-cleared", "target": "N:finding:R4-cleared:1", "label": "应用", "prop": "applies"}}, {"data": {"id": "E:finding:N:finding:R4-cleared:1->conclusion", "source": "N:finding:R4-cleared:1", "target": "N:conclusion", "label": "满足", "prop": "satisfies", "conform": true}}, {"data": {"id": "E:rule:R4-cleared->N:finding:R4-cleared:2", "source": "N:rule:R4-cleared", "target": "N:finding:R4-cleared:2", "label": "应用", "prop": "applies"}}, {"data": {"id": "E:finding:N:finding:R4-cleared:2->conclusion", "source": "N:finding:R4-cleared:2", "target": "N:conclusion", "label": "满足", "prop": "satisfies", "conform": true}}, {"data": {"id": "E:rule:R7-data-gap->N:finding:R7-data-gap:1", "source": "N:rule:R7-data-gap", "target": "N:finding:R7-data-gap:1", "label": "应用", "prop": "applies"}}, {"data": {"id": "E:finding:N:finding:R7-data-gap:1->conclusion", "source": "N:finding:R7-data-gap:1", "target": "N:conclusion", "label": "满足", "prop": "satisfies", "conform": true}}, {"data": {"id": "E:owlrl->conclusion", "source": "N:owlrl", "target": "N:conclusion", "label": "基于", "prop": "based_on"}}]};
const findings = [{"rule": "R1-cleared", "severity": "INFO", "detail": "风险扫描已执行且无一票否决事件，写入 qcc:NoVetoSignal（闭世界已证明无）", "conform": true}, {"rule": "R4-cleared", "severity": "INFO", "detail": "股东 浙江瑞航国际贸易有限公司 持股 68.0%，已入库且无风险标记", "conform": true}, {"rule": "R4-cleared", "severity": "INFO", "detail": "股东 厦门胶友科技有限公司 持股 32.0%，已入库且无风险标记", "conform": true}, {"rule": "R7-data-gap", "severity": "LOW", "detail": "实控人/UBO 未采集，R7 无法判定（需 get_actual_controller / get_beneficial_owners）", "conform": true}];

  { selector: 'node', style: {
    'label': 'data(label)',

  { selector: 'node[type="rule"]', style: {

  { selector: 'node[type="rule"][severity="MEDIUM"]', style: {

  { selector: 'node[type="finding"]', style: {

    'width': 62, 'height': 62, 'font-size': '10px', 'color': '#0f1117',
  } },
  { selector: 'node[type="finding"][severity="HIGH"]', style: {
    'background-color': '#ff6666', 'border-width': 3, 'border-color': '#ffccff',
    'width': 78, 'height': 78, 'z-index': 5,
  } },
  { selector: 'node[type="finding"][severity="MEDIUM"]', style: {

  } },
  { selector: 'node[type="finding"][severity="LOW"]', style: {
    'background-color': '#66cc99',

  } },
  { selector: 'node[type="conclusion"][conform="true"]', style: {
    'background-color': '#66cc99', 'shape': 'hexagon',

  { selector: 'node[type="conclusion"][conform="false"]', style: {

      'target-arrow-shape': 'triangle',

      'target-arrow-size': 8,
      'label': 'data(label)',
      'font-size': '9px',

  { selector: 'edge[prop="based_on"]',  style: { 'line-color': '#8892a6', 'target-arrow-color': '#8892a6', 'line-style': 'dotted' } },

  } },
  { selector: 'node:unselected, edge:unselected', style: {
    'opacity': 0.4, 'text-opacity': 0.25,
  } },
];
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: elements,
  style: style,
  layout: { name: 'cose', animate: false, padding: 50, nodeRepulsion: 12000, idealEdgeLength: 130, edgeElasticity: 180 },
  wheelSensitivity: 0.25,
  minZoom: 0.3,
});
// 侧栏渲染 findings
const findingsBox = document.getElementById('findings');
if(findings.length === 0){
  findingsBox.innerHTML = '<div class="item" style="color:#8892a6;">暂无 finding — 全部规则符合或跳过</div>';
} else {
  findingsBox.innerHTML = findings.map(f =>
    '<div class="item">' +
      '<span class="badge ' + (f.severity||'INFO') + '">' + (f.severity||'INFO') + '</span>' +
      '<span class="rule">' + (f.rule||'?') + '</span>' +
      '<div class="detail">' + (f.detail||'').replace(/</g,'&lt;') + '</div>' +
    '</div>'
  ).join('');
}
// 点击同步
cy.on('tap', 'node', function(e){
  const d = e.target.data();
  if(d.type === 'finding'){
    // 在侧栏中找到对应 finding 并高亮
    const items = findingsBox.querySelectorAll('.item');
    items.forEach(el => el.style.background = '');
    const idx = findings.findIndex(f => (f.rule + '#' + f.severity) === (d.label.match(/\[(\w+)\]/)&& d.label.match(/\[(\w+)\]/)[1]));
  }
});
cy.on('tap', 'edge', function(e){
  const d = e.target.data();
  const s = cy.getElementById(d.source).data('label');
  const t = cy.getElementById(d.target).data('label');
  const sel = s + ' → ' + t + ' · 边：' + d.label + ' (' + d.prop + ')';
  console.log(sel);
});
</script>
